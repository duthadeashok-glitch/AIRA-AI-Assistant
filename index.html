
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIRA AI Assistant</title>

<style>
* {
  box-sizing: border-box;
  }

  body {
    margin: 0;
      min-height: 100vh;
        background: #100d20;
          color: white;
            font-family: Arial, sans-serif;
              display: flex;
                justify-content: center;
                }

                .app {
                  width: 100%;
                    max-width: 430px;
                      min-height: 100vh;
                        padding: 25px;
                          text-align: center;
                          }

                          h1 {
                            color: #d9a3ff;
                              font-size: 38px;
                                margin-top: 35px;
                                }

                                .avatar {
                                  width: 190px;
                                    height: 190px;
                                      margin: 55px auto 25px;
                                        border-radius: 50%;
                                          background: linear-gradient(135deg,#e6aaff,#7044d8);
                                            display: grid;
                                              place-items: center;
                                                font-size: 100px;
                                                  box-shadow: 0 0 45px #a45cff66;
                                                  }

                                                  .status {
                                                    color: #c8b7e0;
                                                      margin: 15px;
                                                      }

                                                      button {
                                                        border: none;
                                                          border-radius: 30px;
                                                            padding: 16px 28px;
                                                              background: #c68aff;
                                                                color: #170e25;
                                                                  font-size: 17px;
                                                                    font-weight: bold;
                                                                      margin-top: 25px;
                                                                      }

                                                                      #output {
                                                                        margin-top: 25px;
                                                                          color: #e5d7ff;
                                                                            min-height: 45px;
                                                                            }
                                                                            </style>
                                                                            </head>

                                                                            <body>
                                                                            <div class="app">

                                                                              <h1>AIRA</h1>

                                                                                <div class="avatar">👧🏻</div>

                                                                                  <h2>Hello! I'm AIRA ❤️</h2>

                                                                                    <p class="status" id="status">
                                                                                        Your AI assistant is ready.
                                                                                          </p>

                                                                                            <button onclick="startAira()">
                                                                                                🎤 Talk to AIRA
                                                                                                  </button>

                                                                                                    <div id="output">
                                                                                                        Say Hello!
                                                                                                          </div>

                                                                                                          </div>

                                                                                                          <script>
                                                                                                          function startAira() {
                                                                                                            const status = document.getElementById("status");

                                                                                                              if (!("webkitSpeechRecognition" in window)) {
                                                                                                                  status.innerText =
                                                                                                                        "Voice input is not supported in this browser.";
                                                                                                                            return;
                                                                                                                              }

                                                                                                                                const recognition =
                                                                                                                                    new webkitSpeechRecognition();

                                                                                                                                      recognition.lang = "hi-IN";
                                                                                                                                        recognition.onstart = () => {
                                                                                                                                            status.innerText = "Listening...";
                                                                                                                                              };

                                                                                                                                                recognition.onresult = (event) => {
                                                                                                                                                    const message =
                                                                                                                                                          event.results[0][0].transcript;

                                                                                                                                                              document.getElementById("output")
                                                                                                                                                                    .innerText = "You said: " + message;

                                                                                                                                                                        status.innerText = "AIRA heard you!";
                                                                                                                                                                          };

                                                                                                                                                                            recognition.onerror = () => {
                                                                                                                                                                                status.innerText = "Please try again.";
                                                                                                                                                                                  };

                                                                                                                                                                                    recognition.start();
                                                                                                                                                                                    }
                                                                                                                                                                                    </script>

                                                                                                                                                                                    </body>
                                                                                                                                                                                    </html>
